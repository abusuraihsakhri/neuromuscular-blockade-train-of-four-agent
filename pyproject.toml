[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromuscular-blockade-train-of-four-engine"
version = "2.0.0"
description = "TOF-Sentinel: Train-of-Four (TOF) Neuromuscular Blockade & Sugammadex Reversal Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
neuromuscular-blockade-train-of-four-engine = "neuromuscular_blockade_train_of_four_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/neuromuscular-blockade-train-of-four-agent"
Repository = "https://github.com/abusuraihsakhri/neuromuscular-blockade-train-of-four-agent.git"

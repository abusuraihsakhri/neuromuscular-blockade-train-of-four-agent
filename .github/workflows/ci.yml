name: Tests and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Check package, tests and clinical classification boundaries
        run: |
          python -m compileall -q .
          python -m pytest -q
      - name: Smoke test installed console script
        run: |
          neuromuscular-blockade-train-of-four-engine --help
          neuromuscular-blockade-train-of-four-engine tof --count 4 --ratio 0.9
      - name: Check JavaScript with Node.js
        run: |
          node --check web/app.mjs
          node --test web/app.test.mjs
      - name: Audit installed dependencies
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pip-audit
          pip-audit
